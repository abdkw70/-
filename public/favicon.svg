<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Wave Pattern -->
  <path d="M 0 380 C 150 340, 300 420, 512 360 L 512 512 L 0 512 Z" fill="#0f172a" opacity="0.3" />
  <path d="M 0 420 C 180 390, 320 450, 512 410 L 512 512 L 0 512 Z" fill="#0369a1" opacity="0.4" />

  <!-- Open Book & Pen Vector -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Book Spine & Pages -->
    <path d="M 0 -80 C 40 -100, 110 -100, 150 -70 L 150 70 C 110 40, 40 40, 0 60 C -40 40, -110 40, -150 70 L -150 -70 C -110 -100, -40 -100, 0 -80 Z" fill="#ffffff" />
    <path d="M 0 -75 L 0 65" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
    
    <!-- Page lines left -->
    <line x1="-120" y1="-30" x2="-30" y2="-30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="-120" y1="0" x2="-30" y2="0" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="-120" y1="30" x2="-50" y2="30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

    <!-- Page lines right -->
    <line x1="30" y1="-30" x2="120" y2="-30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="120" y2="0" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="120" y2="30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

    <!-- Quill / Fountain Pen Nib with Gold Accent -->
    <g transform="translate(0, -90) scale(1.2)">
      <path d="M 0 -50 L 18 10 L 8 40 L -8 40 L -18 10 Z" fill="url(#goldGrad)" />
      <path d="M 0 -50 L 0 15" stroke="#78350f" stroke-width="2.5" />
      <circle cx="0" cy="15" r="2.5" fill="#78350f" />
    </g>
  </g>

  <!-- Kuwait Flag Colors Minimal Ribbon -->
  <g transform="translate(186, 430)">
    <rect x="0" y="0" width="35" height="12" rx="3" fill="#15803d" />
    <rect x="37" y="0" width="35" height="12" rx="3" fill="#ffffff" />
    <rect x="74" y="0" width="35" height="12" rx="3" fill="#dc2626" />
    <polygon points="0,0 12,6 0,12" fill="#000000" />
  </g>
</svg>
